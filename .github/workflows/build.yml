name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # Minecraft 1.20.1 + Forge 47.3.0
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      # ============================================================
      # MERGE BASE + PATCH
      #
      # BASE:
      # xp_backrooms_update_v0.2 .2/main
      #
      # PATCH:
      # zz_patch_03/xp_backrooms_update_v0.2.3/zz_patch_03/main
      #
      # Порядок:
      #
      # BASE
      #   ↓
      # PATCH поверх BASE
      #   ↓
      # ЕДИНЫЕ ИСХОДНИКИ
      # ============================================================
      - name: Merge base and patch
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          BUILD="_build"

          BASE="xp_backrooms_update_v0.2 .2/main"
          PATCH="zz_patch_03/xp_backrooms_update_v0.2.3/zz_patch_03/main"

          echo "========================================"
          echo "Checking source directories"
          echo "========================================"

          if [ ! -d "$BASE" ]; then
            echo "ERROR: BASE directory does not exist:"
            echo "$BASE"
            exit 1
          fi

          if [ ! -d "$PATCH" ]; then
            echo "ERROR: PATCH directory does not exist:"
            echo "$PATCH"
            exit 1
          fi

          rm -rf "$BUILD"
          mkdir -p "$BUILD/src/main"

          echo
          echo "========================================"
          echo "COPY BASE"
          echo "========================================"
          echo "$BASE"

          rsync -a "$BASE"/ "$BUILD/src/main/"

          echo
          echo "========================================"
          echo "COPY PATCH OVER BASE"
          echo "========================================"
          echo "$PATCH"

          rsync -a "$PATCH"/ "$BUILD/src/main/"

          echo
          echo "========================================"
          echo "MERGED SOURCE CREATED"
          echo "========================================"

          find "$BUILD/src/main" -type f | sort

      # ============================================================
      # VERY IMPORTANT VALIDATION
      #
      # Проверяем именно тот файл, который потом будет компилироваться.
      #
      # Эти 4 константы обязаны существовать.
      # ============================================================
      - name: Validate merged BacteriaEntity
        shell: bash
        run: |
          set -euo pipefail

          FILE="_build/src/main/java/com/backroomsport/entity/BacteriaEntity.java"

          echo "========================================"
          echo "VALIDATING:"
          echo "$FILE"
          echo "========================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: BacteriaEntity.java was not created."
            exit 1
          fi

          echo
          echo "File:"
          ls -lh "$FILE"

          echo
          echo "SHA256:"
          sha256sum "$FILE"

          echo
          echo "Constants found:"
          grep -nE \
            'private static final (int|double) (BURST_TICKS|TRIGGER_TICKS|SEARCH_TICKS|SEARCH_RADIUS)' \
            "$FILE" || true

          echo
          echo "Checking required constants..."

          grep -q 'BURST_TICKS' "$FILE" || {
            echo "ERROR: BURST_TICKS is missing"
            exit 1
          }

          grep -q 'TRIGGER_TICKS' "$FILE" || {
            echo "ERROR: TRIGGER_TICKS is missing"
            exit 1
          }

          grep -q 'SEARCH_TICKS' "$FILE" || {
            echo "ERROR: SEARCH_TICKS is missing"
            exit 1
          }

          grep -q 'SEARCH_RADIUS' "$FILE" || {
            echo "ERROR: SEARCH_RADIUS is missing"
            exit 1
          }

          echo
          echo "All required Bacteria constants are present."

      # ============================================================
      # GRADLE SETTINGS
      # ============================================================
      - name: Create settings.gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > _build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()

                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }

          rootProject.name = 'xp_backrooms'
          EOF

      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          set -euo pipefail

          cat > _build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false

          minecraft_version=1.20.1
          forge_version=47.3.0

          mapping_channel=official
          mapping_version=1.20.1

          geckolib_version=4.4.9

          mod_id=xp_backrooms
          mod_version=0.3.0
          mod_group_id=com.backroomsport
          EOF

      # ============================================================
      # BUILD.GRADLE
      # ============================================================
      - name: Create build.gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > _build/build.gradle <<'EOF'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = mod_version
          group = mod_group_id

          base {
              archivesName = mod_id
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: mapping_channel, version: mapping_version

              runs {
                  client {
                      workingDirectory project.file('run')

                      mods {
                          "${mod_id}" {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          repositories {
              maven {
                  name = 'GeckoLib'
                  url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
              }
          }

          dependencies {
              minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

              implementation fg.deobf(
                  "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
              )
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                      'Specification-Title'   : mod_id,
                      'Specification-Vendor'  : mod_group_id,
                      'Specification-Version' : '1',
                      'Implementation-Title'  : project.name,
                      'Implementation-Version': project.jar.archiveVersion,
                      'Implementation-Vendor' : mod_group_id
                  ])
              }

              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      # ============================================================
      # BUILD
      #
      # И BASE, и PATCH уже находятся в одном source tree.
      # Компилируется всё одним Gradle/ForgeGradle.
      # ============================================================
      - name: Build merged mod
        working-directory: _build
        shell: bash
        run: |
          set -euo pipefail

          gradle build \
            --no-daemon \
            --stacktrace

      # ============================================================
      # PREPARE ONE FINAL JAR
      # ============================================================
      - name: Prepare final JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          REOBF_JAR="$(find _build/build/libs \
            -maxdepth 1 \
            -type f \
            -name '*-reobf.jar' \
            | head -n 1)"

          if [ -z "$REOBF_JAR" ]; then
            echo "ERROR: reobf JAR was not created."

            echo
            echo "Contents of _build/build/libs:"
            find _build/build/libs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          cp "$REOBF_JAR" dist/xp_backrooms.jar

          echo
          echo "========================================"
          echo "FINAL JAR"
          echo "========================================"

          ls -lh dist/xp_backrooms.jar
          sha256sum dist/xp_backrooms.jar

      # ============================================================
      # ONE ARTIFACT
      # ============================================================
      - name: Upload final mod
        uses: actions/upload-artifact@v4
        with:
          name: xp_backrooms
          path: dist/xp_backrooms.jar
          if-no-files-found: error
