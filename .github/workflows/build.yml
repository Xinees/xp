name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Assemble project
        run: |
          set -e
          MAIN=$(find . -type d -path '*/main/java/com/backroomsport' -not -path './.git/*' -not -path './_build/*' | head -n 1)
          if [ -z "$MAIN" ]; then
            echo "ERROR: folder main/java/com/backroomsport not found in the repository"
            find . -not -path './.git/*' -maxdepth 3
            exit 1
          fi
          MAIN="${MAIN%/java/com/backroomsport}"
          echo "Sources found in: $MAIN"
          mkdir -p _build/src
          cp -r "$MAIN" _build/src/main

          cat > _build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }
          rootProject.name = 'xp_backrooms'
          EOF

          cat > _build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=1.20.1
          forge_version=47.3.0
          mapping_channel=official
          mapping_version=1.20.1
          geckolib_version=4.4.9
          mod_id=xp_backrooms
          mod_version=0.2.1
          mod_group_id=com.backroomsport
          EOF

          cat > _build/build.gradle <<'EOF'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = mod_version
          group = mod_group_id
          base {
              archivesName = mod_id
          }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: mapping_channel, version: mapping_version
              runs {
                  client {
                      workingDirectory project.file('run')
                      mods {
                          "${mod_id}" {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }
          repositories {
              maven {
                  name = 'GeckoLib'
                  url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
              }
          }
          dependencies {
              minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
              implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
          }
          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                      'Specification-Title'   : mod_id,
                      'Specification-Vendor'  : mod_group_id,
                      'Specification-Version' : '1',
                      'Implementation-Title'  : project.name,
                      'Implementation-Version': project.jar.archiveVersion,
                      'Implementation-Vendor' : mod_group_id
                  ])
              }
              finalizedBy 'reobfJar'
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Build
        working-directory: _build
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xp_backrooms-jar
          path: _build/build/libs/*.jar
