name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Prepare project
        id: find
        run: |
          set -e
          SEARCH=.
          if [ -f project.zip ]; then
            echo "Using project.zip"
            rm -rf _build
            mkdir _build
            unzip -q project.zip -d _build
            SEARCH=_build
          fi
          FILE=$(find "$SEARCH" -name settings.gradle -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle was not found. Upload project.zip to the repository root. Repository content:"
            find . -not -path './.git/*' -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xp_backrooms-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
